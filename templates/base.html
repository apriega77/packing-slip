<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="p:domain_verify" content="120b0b474d5871d280cbe05e4f59b3f9"/>
<title>{% block title %}{{ site.name }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ site.description }}{% endblock %}">
{% if canonical %}<link rel="canonical" href="{{ canonical }}">{% endif %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ root }}static/style.css">
{% block head %}{% endblock %}
</head>
<body>
<div class="airmail" aria-hidden="true"></div>
<header class="masthead">
  <a class="masthead-name" href="{{ root }}">{{ site.name }}</a>
  <nav class="site-nav" aria-label="Site">
    <ul>
      <li><a href="{{ root }}"{% if current == "home" %} aria-current="page"{% endif %}>Guides</a></li>
      <li><a href="{{ root }}disclosure/"{% if current == "disclosure" %} aria-current="page"{% endif %}>Disclosure</a></li>
    </ul>
  </nav>
</header>
<main>
{% block main %}{% endblock %}
</main>
<footer class="colophon">
  <p>Some links on {{ site.name }} earn us a commission. <a href="{{ root }}disclosure/">Read how affiliate links work here</a></p>
  <p>&copy; {{ year }} {{ site.name }}</p>
</footer>
</body>
</html>
